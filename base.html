<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0;padding:0;background:#060a18;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#060a18;">
    <tr><td align="center" style="padding:32px 10px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:540px;width:100%;">

            <!-- Logo -->
            <tr><td align="center" style="padding-bottom:24px;">
                <span style="color:#e2e4f0;font-size:16px;font-weight:700;letter-spacing:-0.3px;">Synavue<span style="color:#3b82f6;">Dev</span></span>
            </td></tr>

            <!-- Card -->
            <tr><td style="background:#0a0f24;border:1px solid rgba(59,130,246,0.12);border-radius:12px;overflow:hidden;">

                <!-- Header -->
                <table width="100%" cellpadding="0" cellspacing="0">
                    <tr><td style="padding:22px 24px 16px;border-bottom:1px solid rgba(255,255,255,0.06);">
                        <p style="margin:0 0 6px;color:#3b82f6;font-size:10px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;">{% block header_label %}Notification{% endblock %}</p>
                        <h1 style="margin:0;color:#e2e4f0;font-size:18px;font-weight:600;line-height:1.35;">{% block header_title %}{% endblock %}</h1>
                    </td></tr>
                </table>

                <!-- Body -->
                <table width="100%" cellpadding="0" cellspacing="0">
                    <tr><td style="padding:22px 24px 24px;">
                        {% block body %}{% endblock %}
                        {% block cta %}{% endblock %}
                    </td></tr>
                </table>
            </td></tr>

            <!-- Footer -->
            <tr><td style="padding:24px 0;text-align:center;">
                <p style="margin:0 0 4px;color:#4b5563;font-size:10px;">&copy; Synavue Technologies</p>
                <p style="margin:0;color:#4b5563;font-size:10px;">{% block footer_note %}You received this email from SynavueDev.{% endblock %}</p>
            </td></tr>

        </table>
    </td></tr>
    </table>
</body>
</html>
